name: EasyTier GUI macOS ARM64 Test

on:
  workflow_dispatch:
  push:
    branches:
      - codex/gui-macos-arm64-test

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  build-gui-macos-arm64:
    runs-on: macos-latest
    env:
      TARGET: aarch64-apple-darwin
      GUI_TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v5

      - name: Set current ref as env variable
        run: |
          echo "GIT_DESC=$(git log -1 --format=%cd.%h --date=format:%Y-%m-%d_%H:%M:%S)" >> "$GITHUB_ENV"

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          target: ${{ env.TARGET }}
          gui: true
          pnpm: true
          pnpm-build-filter: ''
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: gui-test
          shared-key: macos-aarch64
          cache-targets: true
          cache-on-failure: true

      - name: Test Quinn UDP truncated datagram handling
        timeout-minutes: 5
        run: |
          set -euo pipefail
          cargo test --locked --target "$GUI_TARGET" \
            --package quinn-udp --test tests \
            truncated_datagram_does_not_spin_after_eagain -- \
            --exact --nocapture

      - name: Test macOS policy resolver ownership
        timeout-minutes: 10
        run: |
          set -euo pipefail
          cargo test --locked --target "$GUI_TARGET" \
            --package easytier --lib --features leaf-policy-proxy \
            policy_proxy::macos_routing::tests -- \
            --nocapture --test-threads 1

      - name: Test macOS interface cache
        timeout-minutes: 10
        run: |
          set -euo pipefail
          cargo test --locked --target "$GUI_TARGET" \
            --package easytier --lib --features leaf-policy-proxy \
            tunnel::common::tests::interface_index_cache -- \
            --nocapture --test-threads 1

      - name: Test macOS scoped DNS selection
        timeout-minutes: 10
        run: |
          set -euo pipefail
          cargo test --locked --target "$GUI_TARGET" \
            --package easytier-policy --lib \
            leaf_process::tests::macos_system_dns_uses_only_the_selected_scoped_interface -- \
            --exact --nocapture --test-threads 1

      - name: Build policy sidecars
        env:
          HEV_SERVER_COMMIT: 97e74f1068bd924e740032382cdc94ca83741ae6
        run: |
          set -euo pipefail
          cargo build --locked --release --target "$GUI_TARGET" \
            --package easytier-policy --bin easytier-leaf-worker --features leaf-worker
          mkdir -p easytier-gui/src-tauri/binaries
          cp "target/$GUI_TARGET/release/easytier-leaf-worker" \
            "easytier-gui/src-tauri/binaries/easytier-leaf-worker-$GUI_TARGET"
          scripts/build-hev-socks-egress.sh "$GUI_TARGET" \
            "easytier-gui/src-tauri/binaries/easytier-hev-socks-egress-$GUI_TARGET"
          test -x "easytier-gui/src-tauri/binaries/easytier-leaf-worker-$GUI_TARGET"
          test -x "easytier-gui/src-tauri/binaries/easytier-hev-socks-egress-$GUI_TARGET"
          printf 'component=easytier-socks-egress\ntarget=%s\nbackend=hev-native\n' \
            "$GUI_TARGET" \
            > easytier-gui/src-tauri/binaries/SOCKS_EGRESS_BUILD_INFO.txt

      - name: Resolve latest stable Mihomo release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/fetch-mihomo-release.sh resolve-latest \
            target/mihomo-release-manifest.json

      - name: Fetch and verify workflow-pinned Mihomo
        env:
          MIHOMO_RELEASE_MANIFEST: ${{ github.workspace }}/target/mihomo-release-manifest.json
        run: |
          set -euo pipefail
          MIHOMO_DISTRIBUTED_BINARY_NAME="easytier-mihomo" \
            bash scripts/fetch-mihomo-release.sh fetch "$GUI_TARGET" \
            "easytier-gui/src-tauri/binaries/easytier-mihomo-$GUI_TARGET" \
            "easytier-gui/src-tauri/binaries/easytier-mihomo-manifest.json"
          cp easytier/resources/policy-rule-data/METACUBEX-GPL-3.0.txt \
            easytier-gui/src-tauri/binaries/MIHOMO_LICENSE.txt
          cp easytier/resources/mihomo/SOURCE.md \
            easytier-gui/src-tauri/binaries/MIHOMO_SOURCE.md
          bash scripts/fetch-gost-release.sh fetch "$GUI_TARGET" \
            "easytier-gui/src-tauri/binaries/easytier-gost-$GUI_TARGET" \
            "easytier-gui/src-tauri/binaries/easytier-gost.manifest.json"
          cp easytier/resources/gost/LICENSE \
            easytier-gui/src-tauri/binaries/GOST_LICENSE.txt
          cp easytier/resources/gost/SOURCE.md \
            easytier-gui/src-tauri/binaries/GOST_SOURCE.md
          cargo build --locked --release --target "$GUI_TARGET" \
            --package easytier-socks-egress --bin easytier-gost-guardian
          cp "target/$GUI_TARGET/release/easytier-gost-guardian" \
            "easytier-gui/src-tauri/binaries/easytier-gost-guardian-$GUI_TARGET"
          test -x "easytier-gui/src-tauri/binaries/easytier-gost-guardian-$GUI_TARGET"

      - name: Build GUI
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: ./easytier-gui
          args: --verbose --target ${{ env.GUI_TARGET }}

      - name: Verify signed policy sidecars
        run: |
          set -euo pipefail
          app_dir=$(find "target/$GUI_TARGET/release/bundle/macos" -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$app_dir"
          for executable in easytier-gui easytier-leaf-worker easytier-hev-socks-egress easytier-gost-guardian easytier-gost easytier-mihomo; do
            test -x "$app_dir/Contents/MacOS/$executable"
            codesign --verify --strict --verbose=2 "$app_dir/Contents/MacOS/$executable"
          done
          for required_name in \
            easytier-mihomo-manifest.json \
            MIHOMO_LICENSE.txt \
            MIHOMO_SOURCE.md \
            MIHOMO_SHA256SUMS.txt \
            MIHOMO_BUILD_INFO.txt \
            easytier-gost.manifest.json \
            GOST_LICENSE.txt \
            GOST_SOURCE.md \
            SOCKS_EGRESS_BUILD_INFO.txt
          do
            test -f "$app_dir/Contents/Resources/$required_name"
          done
          codesign --verify --deep --strict --verbose=2 "$app_dir"

      - name: Collect artifact
        run: |
          set -euo pipefail
          mkdir -p ./artifacts
          cp target/mihomo-release-manifest.json \
            "./artifacts/MIHOMO_RELEASE_MANIFEST-${GUI_TARGET}.json"
          mv "./target/${GUI_TARGET}/release/bundle/dmg/"*.dmg ./artifacts/
          shasum -a 256 ./artifacts/* > ./artifacts/SHA256SUMS.txt
          ls -lh ./artifacts

      - name: Archive artifact
        uses: actions/upload-artifact@v5
        with:
          name: easytier-gui-macos-aarch64-test
          if-no-files-found: error
          retention-days: 7
          path: |
            ./artifacts/*
