name: Issue 4 isolated mesh diagnosis
'on':
  push:
    branches: ['ci/issue-4-diagnosis-20260916']
    paths: ['.github/workflows/mesh-ci-diagnosis.yml', 'tools/mesh-ci/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: issue4-diagnosis-${{ github.ref }}
  cancel-in-progress: false
jobs:
  isolated:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Prepare bounded diagnostic tools
        run: |
          set -euo pipefail
          mkdir -p ci-evidence
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 iputils-ping iperf3 ethtool strace tcpdump autoconf automake libtool linux-tools-common linux-tools-generic
          python3 -m py_compile tools/mesh-ci/diagnose.py tools/mesh-ci/followup.py tools/mesh-ci/control_diagnostic.py
          gcc -shared -fPIC -O2 -Wall -Wextra tools/mesh-ci/select_diagnostic.c -ldl -o ci-evidence/select-diagnostic.so
          dpkg-query -W iperf3 libiperf0 > ci-evidence/iperf-packages.txt
          ldd "$(command -v iperf3)" > ci-evidence/iperf-linkage.txt
          perf_bin="$(find /usr/lib/linux-tools -type f -name perf | sort -V | tail -n1)"
          if [ -n "$perf_bin" ]; then sudo ln -sf "$perf_bin" /usr/local/bin/perf; fi
          perf --version > ci-evidence/perf-version.txt 2>&1 || true
          git diff --check
          uname -a | tee ci-evidence/kernel.txt
          lscpu > ci-evidence/cpu.txt
          cat /proc/self/cgroup > ci-evidence/cgroup.txt
          for f in cpu.max cpu.stat cpu.pressure memory.max; do
            if [ -f "/sys/fs/cgroup/$f" ]; then cat "/sys/fs/cgroup/$f" > "ci-evidence/$f"; fi
          done
      - name: Verify and extract immutable measured Core artifact
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 180 \
            https://github.com/lovitus/EasyTier/releases/download/profiling-beta/easytier-profiling-beta-linux-x86_64-musl.tar.gz -o bundle.tar.gz
          echo '9c7d8a5dc1987491c79e4e1a2576911f18807f7f2ac80570a9675c0291ea2445  bundle.tar.gz' | sha256sum --check
          mkdir -p ci-bundle
          tar -xzf bundle.tar.gz -C ci-bundle --strip-components=1
          echo '95c5724367ce4ab5a33688f871cc1531c50d84e78389e0c77d4d17ea99b5dc71  ci-bundle/easytier-core' | sha256sum --check
          sha256sum ci-bundle/easytier-core ci-bundle/easytier-cli > ci-evidence/binary-sha256.txt
          readelf -n ci-bundle/easytier-core > ci-evidence/build-id.txt
          ci-bundle/easytier-core --version > ci-evidence/core-version.txt
          ci-bundle/easytier-core --help > ci-evidence/core-help.txt
      - name: Build exact iperf 3.9 comparator, not Core
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 90 \
            https://codeload.github.com/esnet/iperf/tar.gz/1f8fb13297f3e3e40169ebcd12e171167e394473 -o iperf39.tar.gz
          mkdir -p ci-iperf39
          tar -xzf iperf39.tar.gz -C ci-iperf39 --strip-components=1
          cd ci-iperf39
          if [ ! -x configure ]; then autoreconf -fi; fi
          ./configure --without-openssl --disable-shared CFLAGS='-O2 -g'
          timeout 180 make -j2
          src/iperf3 --version
      - name: Test exact async-ringbuf contract
        id: ring
        continue-on-error: true
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          evidence="$PWD/ci-evidence"
          standalone="$RUNNER_TEMP/issue4-ring"
          mkdir -p "$standalone"
          cp -r tools/mesh-ci/ring/src tools/mesh-ci/ring/Cargo.toml "$standalone/"
          cp Cargo.lock "$standalone/Cargo.lock"
          cd "$standalone"
          timeout 180 cargo +1.95.0 run --release | tee "$evidence/ring-results.txt"
          cp Cargo.lock "$evidence/ring-Cargo.lock"
          find "$HOME/.cargo/registry/src" -path '*/async-ringbuf-0.3.1/src/*' -name '*.rs' -print0 | \
            xargs -0 grep -n -A18 -B3 'fn poll_flush' > "$evidence/ring-flush-source.txt"
      - name: Execute targeted observers and completion replication
        id: simulation
        run: |
          set -euo pipefail
          sudo --preserve-env=GITHUB_ACTIONS,GITHUB_SHA,RUNNER_OS,ImageVersion \
            timeout --signal=TERM --kill-after=10s 900s python3 tools/mesh-ci/followup.py \
              --bundle ci-bundle --output ci-evidence/lab --iperf39 ci-iperf39/src/iperf3 | tee ci-evidence/simulation.log
      - name: Isolate packaged iperf nonblocking-read behavior
        if: matrix.os == 'ubuntu-22.04'
        run: |
          set -euo pipefail
          sudo --preserve-env=GITHUB_ACTIONS,GITHUB_SHA,RUNNER_OS,ImageVersion \
            timeout --signal=TERM --kill-after=10s 360s python3 tools/mesh-ci/control_diagnostic.py \
              --bundle ci-bundle --output ci-evidence/control --iperf39 ci-iperf39/src/iperf3 | tee ci-evidence/control.log
      - name: Preserve readable observer evidence
        if: always()
        run: |
          set -euo pipefail
          # Only this job's experiment outputs: do not change system paths.
          sudo chown -R "$(id -u):$(id -g)" ci-evidence
          for f in ci-evidence/lab/udp-syscalls-counts.txt ci-evidence/lab/tcp-syscalls-counts.txt ci-evidence/lab/udp-perf-self.txt ci-evidence/ring-flush-source.txt; do
            if [ -f "$f" ]; then echo "ETCI_OBSERVER_FILE $f"; head -n 100 "$f"; fi
          done
      - name: Publish measured summary, including failures
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('ci-evidence/lab/results.jsonl')
          rows=[json.loads(x) for x in p.read_text().splitlines()] if p.exists() else []
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('# Issue #4 diagnostic observations\n\nCore source: `391c191c`; no production patch.\n\n')
              f.write('| Mode | Kind | Label | Result | Mbps | gross CPU s/GiB |\n|---|---|---|---|---:|---:|\n')
              for r in rows:
                  if r['kind'] not in ('iperf','halfclose','idle','harness_failure','cleanup'): continue
                  f.write('|{}|{}|{}|{}|{}|{}|\n'.format(r['mode'],r['kind'],r.get('label',''),r.get('ok',r.get('error','recorded')),r.get('goodput_mbps',''),r.get('cpu_s_per_GiB','')))
              f.write('\nA completed workflow is not an all-tests-pass or production capacity claim. Detailed failures and cleanup are retained.\n')
          print('ETCI_FINAL_COUNTS',json.dumps({'rows':len(rows),'failures':sum(r.get('ok') is False for r in rows),'harness_errors':sum(r['kind']=='harness_failure' for r in rows)}))
          PY
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: issue4-evidence-${{ matrix.os }}-${{ github.sha }}
          path: ci-evidence/
          retention-days: 14
          if-no-files-found: error
      - name: Enforce diagnostic completion and preserve failing outcome
        if: always()
        env:
          RING_OUTCOME: ${{ steps.ring.outcome }}
        run: |
          python3 - <<'PYEND'
          import json, os, sys
          from pathlib import Path
          p=Path('ci-evidence/lab/results.jsonl')
          rows=[json.loads(x) for x in p.read_text().splitlines()] if p.exists() else []
          complete=any(r['kind']=='suite_finished' for r in rows)
          clean=any(r['kind']=='cleanup' and r.get('root_routes_unchanged') and all(x['delete_exit']==0 and not x['residual_pids'] for x in r['namespaces']) for r in rows)
          failed=[r.get('label',r['kind']) for r in rows if r.get('ok') is False or r['kind']=='harness_failure']
          print(json.dumps({'suite_completed':complete,'cleanup_passed':clean,'failed_cases':failed,'ring_outcome':os.getenv('RING_OUTCOME')}))
          sys.exit(0 if complete and clean and not failed and os.getenv('RING_OUTCOME')=='success' else 1)
          PYEND
