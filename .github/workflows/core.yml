name: EasyTier Core

on:
  workflow_dispatch:
  push:
    branches: [ "develop", "main", "releases/**" ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'easytier/docs/**'
  pull_request:
    branches: [ "develop", "main" ]
    types: [ opened, synchronize, reopened, ready_for_review ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    # necessary for windows
    shell: bash

jobs:
  resolve_mihomo:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Resolve latest stable Mihomo release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/fetch-mihomo-release.sh resolve-latest \
            mihomo-release-manifest.json
      - uses: actions/upload-artifact@v5
        with:
          name: mihomo-release-manifest
          path: mihomo-release-manifest.json
          if-no-files-found: error

  pre_job:
    # continue-on-error: true # Uncomment once integration is finished
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    # Map a step output to a job output
    outputs:
      # do not skip push on branch starts with releases/
      should_skip: ${{ steps.skip_check.outputs.should_skip == 'true' && !startsWith(github.ref_name, 'releases/') }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          # All of these options are optional, so you can remove them if you are happy with the defaults
          concurrent_skipping: 'same_content_newer'
          skip_after_successful_duplicate: 'true'
          cancel_others: 'true'
          paths: '["Cargo.toml", "Cargo.lock", "easytier/**", "easytier-policy/**", "easytier-socks-egress/**", "third_party/**", "scripts/build-hev-socks-egress.sh", "scripts/fetch-gost-release.sh", "scripts/fetch-mihomo-release.sh", ".github/workflows/core.yml", ".github/actions/**", "easytier-web/**"]'
  build_web:
    runs-on: ubuntu-latest
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Setup Frontend Environment
        uses: ./.github/actions/prepare-pnpm
        with:
          build-filter: './easytier-web/*'

      - name: Archive artifact
        uses: actions/upload-artifact@v5
        with:
          name: easytier-web-dashboard
          path: |
            easytier-web/frontend/dist/*
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - TARGET: x86_64-unknown-linux-musl
            OS: ubuntu-24.04
            ARTIFACT_NAME: linux-x86_64
            POLICY_RELEASE: true
            MIHOMO_RELEASE: true
          - TARGET: aarch64-unknown-linux-musl
            OS: ubuntu-24.04-arm
            ARTIFACT_NAME: linux-aarch64
            POLICY_RELEASE: true
            MIHOMO_RELEASE: true

          - TARGET: riscv64gc-unknown-linux-musl
            OS: ubuntu-24.04
            ARTIFACT_NAME: linux-riscv64
            MIHOMO_RELEASE: true
          - TARGET: loongarch64-unknown-linux-musl
            OS: ubuntu-24.04
            ARTIFACT_NAME: linux-loongarch64

          - TARGET: armv7-unknown-linux-musleabihf # raspberry pi 2-3-4, not tested
            OS: ubuntu-24.04
            ARTIFACT_NAME: linux-armv7hf
          - TARGET: armv7-unknown-linux-musleabi # raspberry pi 2-3-4, not tested
            OS: ubuntu-24.04
            ARTIFACT_NAME: linux-armv7
          - TARGET: arm-unknown-linux-musleabihf # raspberry pi 0-1, not tested
            OS: ubuntu-24.04
            ARTIFACT_NAME: linux-armhf
          - TARGET: arm-unknown-linux-musleabi # raspberry pi 0-1, not tested
            OS: ubuntu-24.04
            ARTIFACT_NAME: linux-arm

          - TARGET: mips-unknown-linux-musl
            OS: ubuntu-24.04
            ARTIFACT_NAME: linux-mips
          - TARGET: mipsel-unknown-linux-musl
            OS: ubuntu-24.04
            ARTIFACT_NAME: linux-mipsel

          - TARGET: x86_64-unknown-freebsd
            OS: ubuntu-24.04
            ARTIFACT_NAME: freebsd-13.2-x86_64
            BSD_VERSION: 13.2
            MIHOMO_RELEASE: true

          - TARGET: x86_64-apple-darwin
            OS: macos-latest
            ARTIFACT_NAME: macos-x86_64
            POLICY_RELEASE: true
            MIHOMO_RELEASE: true
          - TARGET: aarch64-apple-darwin
            OS: macos-latest
            ARTIFACT_NAME: macos-aarch64
            POLICY_RELEASE: true
            MIHOMO_RELEASE: true

          - TARGET: x86_64-pc-windows-msvc
            OS: windows-latest
            ARTIFACT_NAME: windows-x86_64
            MIHOMO_RELEASE: true
          - TARGET: i686-pc-windows-msvc
            OS: windows-latest
            ARTIFACT_NAME: windows-i686
            MIHOMO_RELEASE: true
          - TARGET: aarch64-pc-windows-msvc
            OS: windows-11-arm
            ARTIFACT_NAME: windows-arm64
            MIHOMO_RELEASE: true

    runs-on: ${{ matrix.OS }}
    env:
      NAME: easytier
      TARGET: ${{ matrix.TARGET }}
      OS: ${{ matrix.OS }}
      POLICY_RELEASE: ${{ matrix.POLICY_RELEASE || false }}
      MIHOMO_RELEASE: ${{ matrix.MIHOMO_RELEASE || false }}
      MIHOMO_RELEASE_MANIFEST: ${{ github.workspace }}/target/mihomo-release/mihomo-release-manifest.json
      OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
    needs:
      - pre_job
      - build_web
      - resolve_mihomo
    if: needs.pre_job.outputs.should_skip != 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Set current ref as env variable
        run: |
          echo "GIT_DESC=$(git log -1 --format=%cd.%h --date=format:%Y-%m-%d_%H:%M:%S)" >> "$GITHUB_ENV"

      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: easytier-web-dashboard
          path: easytier-web/frontend/dist/

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          target: ${{ matrix.TARGET }}
          gui: true
          pnpm: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2
        with:
          # The prefix cache key, this can be changed to start a new cache manually.
          # default: "v0-rust"
          prefix-key: ""
          shared-key: "core-registry"
          cache-targets: "false"

      - uses: mlugg/setup-zig@v2
        if: ${{ contains(matrix.OS, 'ubuntu') }}
        with:
          version: 0.16.0
          use-cache: true

      - uses: taiki-e/install-action@v2
        if: ${{ contains(matrix.OS, 'ubuntu') }}
        with:
          tool: cargo-zigbuild

      - name: Build Leaf policy sidecar
        if: matrix.POLICY_RELEASE == true
        run: |
          set -euo pipefail
          cargo build --locked --release --target "$TARGET" \
            --package easytier-policy --bin easytier-leaf-worker --features leaf-worker

      - name: Build legacy Leaf policy SOCKS sidecar
        if: matrix.POLICY_RELEASE == true || contains(matrix.TARGET, 'windows')
        env:
          HEV_SERVER_COMMIT: 97e74f1068bd924e740032382cdc94ca83741ae6
        run: |
          set -euo pipefail
          suffix=""
          backend="hev-native"
          if [[ "$TARGET" == *windows* ]]; then suffix=".exe"; fi
          if [[ "$TARGET" == *windows* ]]; then
            backend="leaf-portable"
          fi
          scripts/build-hev-socks-egress.sh "$TARGET" \
            "target/$TARGET/release/easytier-hev-socks-egress$suffix"
          sidecar="target/$TARGET/release/easytier-hev-socks-egress$suffix"
          test -f "$sidecar"
          if [[ "$TARGET" != *windows* ]]; then test -x "$sidecar"; fi
          printf 'component=easytier-socks-egress\ntarget=%s\nbackend=%s\n' \
            "$TARGET" "$backend" \
            > "target/$TARGET/release/SOCKS_EGRESS_BUILD_INFO.txt"
          python3 - "$sidecar" "$TARGET" <<'PY'
          import pathlib, struct, sys
          data = pathlib.Path(sys.argv[1]).read_bytes()
          target = sys.argv[2]
          expected = {
              "x86_64-unknown-linux-musl": 62,
              "aarch64-unknown-linux-musl": 183,
              "x86_64-unknown-freebsd": 62,
              "x86_64-pc-windows-msvc": 0x8664,
              "i686-pc-windows-msvc": 0x014c,
              "aarch64-pc-windows-msvc": 0xaa64,
          }
          if "apple-darwin" in target:
              machine = struct.unpack_from("<I", data, 4)[0]
              wanted = 0x01000007 if target.startswith("x86_64") else 0x0100000c
          elif "windows" in target:
              offset = struct.unpack_from("<I", data, 0x3c)[0]
              if data[offset:offset + 4] != b"PE\0\0":
                  raise SystemExit("invalid portable socks-egress PE header")
              machine = struct.unpack_from("<H", data, offset + 4)[0]
              wanted = expected[target]
          else:
              if data[:4] != b"\x7fELF":
                  raise SystemExit("invalid portable socks-egress ELF header")
              endian = "<" if data[5] == 1 else ">"
              machine = struct.unpack_from(endian + "H", data, 18)[0]
              wanted = expected[target]
          if machine != wanted:
              raise SystemExit(f"socks-egress machine mismatch: expected {wanted}, got {machine}")
          PY

      - name: Fetch pinned GOST mesh entry
        if: contains('x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,x86_64-apple-darwin,aarch64-apple-darwin,x86_64-unknown-freebsd,x86_64-pc-windows-msvc,i686-pc-windows-msvc,aarch64-pc-windows-msvc', matrix.TARGET)
        run: |
          set -euo pipefail
          suffix=""
          if [[ "$TARGET" == *windows* ]]; then suffix=".exe"; fi
          runtime_dir="target/$TARGET/release"
          bash scripts/fetch-gost-release.sh fetch "$TARGET" \
            "$runtime_dir/easytier-gost$suffix" \
            "$runtime_dir/easytier-gost.manifest.json"
          cp easytier/resources/gost/LICENSE "$runtime_dir/GOST_LICENSE.txt"
          cp easytier/resources/gost/SOURCE.md "$runtime_dir/GOST_SOURCE.md"

      - name: Build GOST parent guardian
        if: contains(matrix.TARGET, 'apple-darwin') || matrix.TARGET == 'x86_64-unknown-freebsd'
        run: |
          set -euo pipefail
          cargo build --locked --release --target "$TARGET" \
            --package easytier-socks-egress --bin easytier-gost-guardian
          test -x "target/$TARGET/release/easytier-gost-guardian"

      - name: Build Windows policy worker
        if: contains(matrix.TARGET, 'windows')
        run: |
          set -euo pipefail
          cargo build --locked --release --target "$TARGET" \
            --package easytier-policy --bin easytier-leaf-worker --features leaf-worker

      - name: Build
        if: ${{ !contains(matrix.TARGET, 'mips') }}
        run: |
          if [[ "$TARGET" == *windows* ]]; then
            SUFFIX=.exe
          else
            SUFFIX=""
          fi

          if [[ "$TARGET" =~ (x86_64-unknown-linux-musl|aarch64-unknown-linux-musl|windows|darwin) ]]; then
            BUILD=build
          else
            BUILD=zigbuild
          fi

          if [[ "$TARGET" =~ ^(riscv64|loongarch64|aarch64).*$ || "$TARGET" =~ (freebsd|windows) ]]; then
            FEATURES="mimalloc"
          else
            FEATURES="jemalloc"
          fi
          if [[ "$POLICY_RELEASE" == "true" ]]; then
            FEATURES="$FEATURES,leaf-policy-proxy"
          fi
          if [[ "$TARGET" == *windows* ]]; then
            FEATURES="$FEATURES,leaf-policy-windows"
          fi
          
          cargo "$BUILD" --locked --release --target "$TARGET" --package=easytier-web --features=embed
          mv "./target/$TARGET/release/easytier-web$SUFFIX" "./target/$TARGET/release/easytier-web-embed$SUFFIX"
          
          cargo "$BUILD" --locked --release --target "$TARGET" --features="$FEATURES"

      - name: Download resolved Mihomo release manifest
        uses: actions/download-artifact@v5
        with:
          name: mihomo-release-manifest
          path: target/mihomo-release

      - name: Fetch and verify workflow-pinned Mihomo
        if: matrix.MIHOMO_RELEASE == true
        run: |
          set -euo pipefail
          if [[ "$TARGET" == *windows* ]]; then
            SUFFIX=.exe
          else
            SUFFIX=""
          fi
          runtime_dir="target/$TARGET/release"
          mkdir -p "$runtime_dir"
          bash scripts/fetch-mihomo-release.sh fetch "$TARGET" \
            "$runtime_dir/easytier-mihomo$SUFFIX" \
            "$runtime_dir/easytier-mihomo.manifest.json"
          cp easytier/resources/policy-rule-data/METACUBEX-GPL-3.0.txt \
            "$runtime_dir/MIHOMO_LICENSE.txt"
          cp easytier/resources/mihomo/SOURCE.md "$runtime_dir/MIHOMO_SOURCE.md"

      - name: Mark unsupported Mihomo target
        if: matrix.MIHOMO_RELEASE != true
        run: |
          set -euo pipefail
          runtime_dir="./target/$TARGET/release"
          mkdir -p "$runtime_dir"
          reason="$(jq -er --arg target "$TARGET" '.targets[$target] | select(.status == "needs_review") | .reason' \
            easytier/resources/mihomo/manifest.json)"
          printf 'target=%s\nstatus=unsupported\nreason=%s\n' "$TARGET" "$reason" \
            > "$runtime_dir/MIHOMO_UNSUPPORTED.txt"

      - name: Stage Windows runtime payload
        if: contains(matrix.TARGET, 'windows')
        run: |
          set -euo pipefail
          case "$TARGET" in
            x86_64*)  ARCH_DIR=x86_64 ;;
            i686*)    ARCH_DIR=i686 ;;
            aarch64*) ARCH_DIR=arm64 ;;
            *)        echo "unsupported Windows target: $TARGET" >&2; exit 1 ;;
          esac
          runtime_dir="target/$TARGET/release"
          find "easytier/third_party/$ARCH_DIR" -maxdepth 1 -type f \
            \( -name "*.dll" -o -name "*.sys" \) -exec cp {} "$runtime_dir/" \;
          test -f "$runtime_dir/wintun.dll"
          test -f "$runtime_dir/Packet.dll"

      - name: Verify Windows policy feature
        if: contains(matrix.TARGET, 'windows')
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $runtimeDir = Join-Path $PWD "target/$env:TARGET/release"
          $core = Join-Path $runtimeDir "easytier-core.exe"
          $worker = Join-Path $runtimeDir "easytier-leaf-worker.exe"
          $helpFile = Join-Path $env:RUNNER_TEMP "easytier-core-help.txt"
          $socksEgress = Join-Path $runtimeDir "easytier-hev-socks-egress.exe"
          $socksBuildInfo = Join-Path $runtimeDir "SOCKS_EGRESS_BUILD_INFO.txt"
          $gost = Join-Path $runtimeDir "easytier-gost.exe"
          $gostMetadata = Join-Path $runtimeDir "easytier-gost.manifest.json"
          foreach ($required in @($core, $worker, $socksEgress, $socksBuildInfo, $gost, $gostMetadata, (Join-Path $runtimeDir "GOST_LICENSE.txt"), (Join-Path $runtimeDir "GOST_SOURCE.md"), (Join-Path $runtimeDir "wintun.dll"), (Join-Path $runtimeDir "Packet.dll"))) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "missing Windows runtime payload: $required"
            }
          }
          & $core --help 2>&1 | Tee-Object -FilePath $helpFile
          if ($LASTEXITCODE -ne 0) {
            throw "easytier-core --help exited with code $LASTEXITCODE"
          }
          if (-not (Select-String -LiteralPath $helpFile -SimpleMatch -Pattern "--policy-config")) {
            throw "easytier-core --help is missing --policy-config"
          }

      - name: Build (MIPS)
        if: ${{ contains(matrix.TARGET, 'mips') }}
        env:
          RUSTC_BOOTSTRAP: 1
        run: |
          cargo build --locked -r --target "$TARGET" -Z build-std=std,panic_abort --package=easytier --features=jemalloc

      - name: Sign and verify macOS release executables
        if: contains(matrix.TARGET, 'darwin')
        run: |
          set -euo pipefail
          executables=(
            easytier-core
            easytier-cli
            easytier-web
            easytier-web-embed
            easytier-hev-socks-egress
            easytier-gost-guardian
            easytier-gost
          )
          if [[ "$POLICY_RELEASE" == "true" ]]; then
            executables+=(easytier-leaf-worker easytier-mihomo)
          fi
          for executable in "${executables[@]}"
          do
            binary="target/$TARGET/release/$executable"
            test -x "$binary"
            codesign --force --sign - "$binary"
            codesign --verify --strict --verbose=2 "$binary"
          done

      - name: Compress
        run: |
          mkdir -p ./artifacts/objects/

          # windows is the only OS using a different convention for executable file name
          if [[ $OS =~ ^windows.*$ ]]; then
              SUFFIX=.exe
              case $TARGET in
                  x86_64*)  ARCH_DIR=x86_64 ;;
                  i686*)    ARCH_DIR=i686 ;;
                  aarch64*) ARCH_DIR=arm64 ;;
              esac
              if [[ -n "$ARCH_DIR" ]]; then
                  find "easytier/third_party/${ARCH_DIR}" -maxdepth 1 -type f \( -name "*.dll" -o -name "*.sys" \) -exec cp {} ./artifacts/objects/ \;
                  test -f ./artifacts/objects/wintun.dll
              fi
          fi

          if [[ $OS =~ ^ubuntu.*$ && ! $TARGET =~ (loongarch|freebsd) ]]; then
            HOST_ARCH=$(uname -m)
            case $HOST_ARCH in
              x86_64)  UPX_ARCH="amd64" ;;
              aarch64) UPX_ARCH="arm64" ;;
              *)       UPX_ARCH="amd64" ;;
            esac

            UPX_VERSION=4.2.4
            UPX_PKG="upx-${UPX_VERSION}-${UPX_ARCH}_linux"
            curl -L "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/${UPX_PKG}.tar.xz" -s | tar xJvf -
            cp "${UPX_PKG}/upx" .
            UPX_BIN=./upx
          fi

          for BIN in ./target/$TARGET/release/easytier-{core,cli,web,web-embed}"$SUFFIX"; do
            if [[ -f "$BIN" ]]; then
              if [[ -n "$UPX_BIN" ]]; then
                $UPX_BIN --lzma --best "$BIN" || true
              fi

              mv "$BIN" ./artifacts/objects/
            fi
          done

          if [[ "$POLICY_RELEASE" == "true" ]]; then
            BIN="./target/$TARGET/release/easytier-leaf-worker$SUFFIX"
            test -x "$BIN"
            mv "$BIN" ./artifacts/objects/
          fi
          case "$TARGET" in
            x86_64-unknown-linux-musl|aarch64-unknown-linux-musl|x86_64-apple-darwin|aarch64-apple-darwin|x86_64-unknown-freebsd|x86_64-pc-windows-msvc|i686-pc-windows-msvc|aarch64-pc-windows-msvc)
              GOST_BIN="./target/$TARGET/release/easytier-gost$SUFFIX"
              GOST_METADATA="./target/$TARGET/release/easytier-gost.manifest.json"
              bash scripts/fetch-gost-release.sh verify "$TARGET" \
                "$GOST_BIN" "$GOST_METADATA"
              mv "$GOST_BIN" "$GOST_METADATA" \
                "./target/$TARGET/release/GOST_LICENSE.txt" \
                "./target/$TARGET/release/GOST_SOURCE.md" \
                ./artifacts/objects/
              ;;
          esac
          case "$TARGET" in
            x86_64-apple-darwin|aarch64-apple-darwin|x86_64-unknown-freebsd)
              GUARDIAN_BIN="./target/$TARGET/release/easytier-gost-guardian"
              test -x "$GUARDIAN_BIN"
              mv "$GUARDIAN_BIN" ./artifacts/objects/
              ;;
          esac
          if [[ "$POLICY_RELEASE" == "true" || "$TARGET" == *windows* ]]; then
            BIN="./target/$TARGET/release/easytier-hev-socks-egress$SUFFIX"
            test -f "$BIN"
            if [[ "$TARGET" != *windows* ]]; then test -x "$BIN"; fi
            mv "$BIN" "./target/$TARGET/release/SOCKS_EGRESS_BUILD_INFO.txt" \
              ./artifacts/objects/
          fi
          if [[ "$TARGET" == *windows* ]]; then
            BIN="./target/$TARGET/release/easytier-leaf-worker$SUFFIX"
            test -f "$BIN"
            mv "$BIN" ./artifacts/objects/
          fi
          if [[ "$MIHOMO_RELEASE" == "true" ]]; then
            MIHOMO_BIN="./target/$TARGET/release/easytier-mihomo$SUFFIX"
            MIHOMO_METADATA="./target/$TARGET/release/easytier-mihomo.manifest.json"
            test -f "$MIHOMO_BIN"
            bash scripts/fetch-mihomo-release.sh verify "$TARGET" \
              "$MIHOMO_BIN" "$MIHOMO_METADATA"
            mv "$MIHOMO_BIN" "$MIHOMO_METADATA" \
              "./target/$TARGET/release/MIHOMO_LICENSE.txt" \
              "./target/$TARGET/release/MIHOMO_SOURCE.md" \
              "./target/$TARGET/release/MIHOMO_SHA256SUMS.txt" \
              "./target/$TARGET/release/MIHOMO_BUILD_INFO.txt" \
              ./artifacts/objects/
          else
            test -f "./target/$TARGET/release/MIHOMO_UNSUPPORTED.txt"
            mv "./target/$TARGET/release/MIHOMO_UNSUPPORTED.txt" ./artifacts/objects/
          fi

          cp "$MIHOMO_RELEASE_MANIFEST" \
            "./artifacts/objects/MIHOMO_RELEASE_MANIFEST.json"
          mv ./artifacts/objects/* ./artifacts/
          rm -rf ./artifacts/objects/

      - name: Archive artifact
        uses: actions/upload-artifact@v5
        with:
          name: easytier-${{ matrix.ARTIFACT_NAME }}
          path: |
            ./artifacts/*

  build_magisk:
    runs-on: ubuntu-latest
    needs: [ pre_job, build_web, build ]
    if: needs.pre_job.result == 'success' && needs.pre_job.outputs.should_skip != 'true' && !cancelled()
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5  # 必须先检出代码才能获取模块配置

      # 下载二进制文件到独立目录
      - name: Download Linux aarch64 binaries
        uses: actions/download-artifact@v4
        with:
          name: easytier-linux-aarch64
          path: ./downloaded-binaries/  # 独立目录避免冲突

      # 将二进制文件复制到 Magisk 模块目录
      - name: Prepare binaries
        run: |
          mkdir -p ./easytier-contrib/easytier-magisk/
          cp ./downloaded-binaries/easytier-core ./easytier-contrib/easytier-magisk/
          cp ./downloaded-binaries/easytier-cli ./easytier-contrib/easytier-magisk/
          cp ./downloaded-binaries/easytier-web ./easytier-contrib/easytier-magisk/
          cp ./downloaded-binaries/easytier-leaf-worker ./easytier-contrib/easytier-magisk/
          cp ./downloaded-binaries/easytier-hev-socks-egress ./easytier-contrib/easytier-magisk/

      # 上传生成的模块
      - name: Upload Magisk Module
        uses: actions/upload-artifact@v5
        with:
          name: Easytier-Magisk
          path: |
            ./easytier-contrib/easytier-magisk
            !./easytier-contrib/easytier-magisk/build.sh
            !./easytier-contrib/easytier-magisk/magisk_update.json
          if-no-files-found: error

  core-result:
    runs-on: ubuntu-latest
    needs: [ pre_job, build_web, build, build_magisk ]
    if: needs.pre_job.result == 'success' && needs.pre_job.outputs.should_skip != 'true' && !cancelled()
    steps:
      - name: Mark result as failed
        if: contains(needs.*.result, 'failure')
        run: exit 1
