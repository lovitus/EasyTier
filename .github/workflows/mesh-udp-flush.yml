name: Actual Core UDP flush-boundary experiment
'on':
  workflow_dispatch:
    inputs:
      saturation:
        description: Run saturation and separate CPU profiles instead of repeating fixed-load measurements
        type: boolean
        default: false
      profile_only:
        description: Reuse the exact 1639ec45 binaries and run only the corrected profile lane
        type: boolean
        default: false
      tun_trace:
        description: In the artifact-reuse lane, collect short TUN write traces instead of CPU profiles
        type: boolean
        default: false
      tun_capacity:
        description: Build only the diagnostic candidate and compare bounded TUN head capacities
        type: boolean
        default: false
      tun_compat:
        description: In artifact-reuse mode verify bounded TUN with Stealth and legacy/GSO combinations
        type: boolean
        default: false
      extended_tun:
        description: With tun_compat, exercise IPv4/inner-IPv6 concurrent opposite-direction flows
        type: boolean
        default: false
      loss_replay:
        description: With tun_compat, replay the IPv6 mixed-load ICMP failure with kernel counters
        type: boolean
        default: false
      packet_trace:
        description: With tun_capacity, build bounded packet-stage diagnostics and run loss localization
        type: boolean
        default: false
      packet_trace_current:
        description: Observe packet loss on pinned integrated Core 3166ab67; diagnostics only, no performance acceptance
        type: boolean
        default: false
      packet_trace_reuse:
        description: Reuse immutable integrated diagnostic binaries without rebuilding; extended_tun enables mixed flow
        type: boolean
        default: false
      paced_tun:
        description: Reuse existing candidate for fixed-load inner-IPv6 mixed-flow comparison; never rebuild Core
        type: boolean
        default: false
      udp_gro_current:
        description: Build one isolated receive-GRO adapter on pinned Core and compare off/on with unchanged lab assertions
        type: boolean
        default: false
  push:
    branches: ['codex/issue4-natural-cohort']
    paths: ['tools/mesh-udp-flush/**', '.github/workflows/mesh-udp-flush.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: issue4-udp-flush-${{ github.ref }}
  cancel-in-progress: false
jobs:
  core-flush:
    if: ${{ !inputs.udp_gro_current && !inputs.profile_only && !inputs.paced_tun && !inputs.packet_trace_current && !inputs.packet_trace_reuse }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      FORK_SHA: c6772dbfef2395ff96b39bd4801945d92212dffb
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '1'
      CARGO_PROFILE_RELEASE_STRIP: 'false'
      RUSTFLAGS: '-C force-frame-pointers=yes -C link-arg=-fuse-ld=mold'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Use the maintained Core build prerequisites
        uses: ./.github/actions/prepare-build
        with:
          target: x86_64-unknown-linux-gnu
          pnpm: 'false'
          gui: 'false'
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v5
        if: ${{ inputs.tun_capacity }}
        with:
          artifact-ids: '10841125115'
          run-id: '36074709548'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reused
          merge-multiple: true
      - name: Verify reused baseline and load generator
        if: ${{ inputs.tun_capacity }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reused/tools
          cp tools/easytier-perf-probe.rs reused/tools/
          cd reused
          test "$(cat flush-evidence/experiment-sha.txt)" = 1639ec4534eb824ce88e7300b5fa1453839c4f25
          sha256sum -c flush-evidence/binaries.sha256
          sha256sum -c flush-evidence/probe.sha256
          chmod +x flush-binaries/{stock,candidate}/easytier-{core,cli} flush-binaries/perf-probe
      - name: Prepare exact source and required build environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p flush-evidence flush-binaries/stock flush-binaries/candidate
          python3 -m py_compile tools/mesh-udp-flush/*.py
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq pkg-config clang cmake libssl-dev libprotobuf-dev libpcap-dev iproute2 iputils-ping ethtool tcpdump
          rustup component add --toolchain 1.95 rustfmt
          protoc --version > flush-evidence/protoc.txt
          test "$(cat flush-evidence/protoc.txt)" = 'libprotoc 35.1'
          timeout 90 git fetch --no-tags --depth=1 origin "$FORK_SHA"
          git worktree add --detach "$RUNNER_TEMP/flush-source" "$FORK_SHA"
          lscpu > flush-evidence/cpu.txt
          uname -a > flush-evidence/kernel.txt
          rustc +1.95 --version --verbose > flush-evidence/toolchain.txt
          cp "$RUNNER_TEMP/flush-source/Cargo.lock" flush-evidence/Cargo.lock
          printf '%s\n' "$GITHUB_SHA" > flush-evidence/experiment-sha.txt
          printf '%s\n' 'GNU Ubuntu 22.04; Rust 1.95; default+jemalloc; stock plus same-binary legacy/stage/gso; no production rollout' > flush-evidence/BOUNDARY.txt
      - name: Build stock, then the bounded diagnostic batch and contract tests
        env:
          TUN_CAPACITY: ${{ inputs.tun_capacity }}
          PACKET_TRACE: ${{ inputs.packet_trace }}
        shell: bash
        run: |
          set -euo pipefail
          root="$PWD"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/flush-target"
          export RUSTFLAGS='-C force-frame-pointers=yes -C link-arg=-fuse-ld=mold'
          cd "$RUNNER_TEMP/flush-source"
          if [[ "$TUN_CAPACITY" == true ]]; then
            cp "$root/reused/flush-binaries/stock/"* "$root/flush-binaries/stock/"
            cp "$root/reused/flush-binaries/perf-probe" "$root/flush-binaries/perf-probe"
            cp "$root/reused/flush-evidence/probe.sha256" "$root/flush-evidence/probe.sha256"
          else
            timeout 1800 cargo +1.95 build --locked --release -j "$(nproc)" -p easytier --bin easytier-core --bin easytier-cli --features jemalloc 2>&1 | tee "$root/flush-evidence/stock-build.log"
            cp "$CARGO_TARGET_DIR/release/easytier-core" "$CARGO_TARGET_DIR/release/easytier-cli" "$root/flush-binaries/stock/"
          fi
          python3 "$root/tools/mesh-udp-flush/prepare.py" "$PWD" > "$root/flush-evidence/diagnostic-source.json"
          if [[ "$TUN_CAPACITY" == true ]]; then
            python3 "$root/tools/mesh-udp-flush/tun_prepare.py" "$PWD" > "$root/flush-evidence/tun-source.json"
            rustfmt +1.95 --edition 2024 easytier/src/instance/linux_tun_offload.rs
            sha256sum easytier/src/instance/linux_tun_offload.rs > "$root/flush-evidence/tun-formatted-source.sha256"
            git diff -- easytier/src/instance/linux_tun_offload.rs > "$root/flush-evidence/tun-diagnostic-only.patch"
          fi
          if [[ "$PACKET_TRACE" == true ]]; then
            test "$TUN_CAPACITY" = true
            python3 "$root/tools/mesh-udp-flush/packet_trace_prepare.py" "$PWD" > "$root/flush-evidence/packet-trace-source.json"
            rustfmt +1.95 --edition 2024 easytier/src/peers/peer_manager.rs
            git diff -- easytier/src/peers/peer_manager.rs > "$root/flush-evidence/packet-trace-peer.patch"
          fi
          rustfmt +1.95 --edition 2024 easytier/src/tunnel/udp.rs
          sha256sum easytier/src/tunnel/udp.rs > "$root/flush-evidence/formatted-source.sha256"
          git diff --check
          git diff --exit-code -- Cargo.lock
          git diff -- easytier/src/tunnel/udp.rs > "$root/flush-evidence/diagnostic-only.patch"
          timeout 900 cargo +1.95 build --locked --release -j "$(nproc)" -p easytier --bin easytier-core --bin easytier-cli --features jemalloc 2>&1 | tee "$root/flush-evidence/candidate-build.log"
          cp "$CARGO_TARGET_DIR/release/easytier-core" "$CARGO_TARGET_DIR/release/easytier-cli" "$root/flush-binaries/candidate/"
          timeout 900 cargo +1.95 test --locked --release -j "$(nproc)" -p easytier --lib --features jemalloc issue4_flush_ -- --test-threads=1 2>&1 | tee "$root/flush-evidence/contract-tests.log"
          cd "$root"
          sha256sum flush-binaries/{stock,candidate}/easytier-{core,cli} > flush-evidence/binaries.sha256
          file flush-binaries/{stock,candidate}/easytier-core > flush-evidence/binary-format.txt
      - name: Run actual Core comparisons and explicit Stealth/UDP checks
        if: ${{ !inputs.saturation && !inputs.tun_capacity }}
        shell: bash
        run: |
          set -euo pipefail
          sudo timeout --signal=TERM --kill-after=15s 480s python3 tools/mesh-udp-flush/lab.py \
            --stock flush-binaries/stock --candidate flush-binaries/candidate --output flush-evidence/lab \
            | tee flush-evidence/lab.log
      - name: Interleaved same-binary TUN capacity comparison
        if: ${{ inputs.tun_capacity && !inputs.packet_trace }}
        shell: bash
        run: |
          set -euo pipefail
          index=0
          for capacity in 0 4096 8192 8192 4096 0 4096 0 8192; do
            sudo timeout --signal=TERM --kill-after=15s 180s python3 tools/mesh-udp-flush/lab.py \
              --stock flush-binaries/stock --candidate flush-binaries/candidate \
              --unpaced-probe flush-binaries/perf-probe --order gso \
              --tun-head-capacity "$capacity" --output "flush-evidence/tun-${index}-${capacity}"
            index=$((index + 1))
          done
      - name: Bounded packet-stage loss localization
        if: ${{ inputs.packet_trace }}
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          index=0
          for capacity in 0 8192 8192 0 0 8192; do
            if sudo timeout --signal=TERM --kill-after=15s 180s python3 tools/mesh-udp-flush/lab.py \
              --stock flush-binaries/stock --candidate flush-binaries/candidate \
              --unpaced-probe flush-binaries/perf-probe --output "flush-evidence/trace-${index}-${capacity}" \
              --order legacy,gso --tun-head-capacity "$capacity" --transfer-bytes 268435456 \
              --inner-ipv6 --mixed-flow --network-counters --icmp-capture --packet-trace; then
              printf 'trace %s: PASS\n' "$index"
            else
              code=$?
              printf 'trace %s: FAIL exit %s\n' "$index" "$code"
              failed=1
            fi
            index=$((index + 1))
          done
          exit "$failed"
      - name: Prepare unpaced probe and profiling tools
        if: ${{ inputs.saturation }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y linux-tools-common "linux-tools-$(uname -r)"
          rustc +1.95 --edition=2021 -O tools/easytier-perf-probe.rs -o flush-binaries/perf-probe
          sha256sum tools/easytier-perf-probe.rs flush-binaries/perf-probe > flush-evidence/probe.sha256
      - name: Uninstrumented direct and mesh saturation comparisons
        if: ${{ inputs.saturation }}
        shell: bash
        run: |
          set -euo pipefail
          sudo timeout --signal=TERM --kill-after=15s 1200s python3 tools/mesh-udp-flush/lab.py \
            --stock flush-binaries/stock --candidate flush-binaries/candidate \
            --unpaced-probe flush-binaries/perf-probe --output flush-evidence/saturation \
            --order stock,legacy,gso,gso,legacy,legacy,gso,stock
      - name: Separate CPU profiles, excluded from throughput comparisons
        if: ${{ inputs.saturation }}
        shell: bash
        run: |
          set -euo pipefail
          sudo timeout --signal=TERM --kill-after=15s 600s python3 tools/mesh-udp-flush/lab.py \
            --stock flush-binaries/stock --candidate flush-binaries/candidate \
            --unpaced-probe flush-binaries/perf-probe --output flush-evidence/profiles \
            --order legacy,gso --profile
      - name: Preserve failures and artifact identities
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" flush-evidence flush-binaries
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('flush-evidence')
          rows=[{'file':str(p.relative_to(root)),'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(root.rglob('*')) if p.is_file()]
          (root/'manifest.json').write_text(json.dumps(rows,indent=2))
          PY
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: issue4-udp-flush-${{ github.sha }}
          path: |
            flush-evidence/
            flush-binaries/
          retention-days: 30
          if-no-files-found: error
  profile-only:
    if: ${{ (inputs.profile_only || inputs.paced_tun) && !inputs.packet_trace_current && !inputs.packet_trace_reuse }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ (inputs.tun_compat || inputs.paced_tun) && '10842834881' || '10841125115' }}
          run-id: ${{ (inputs.tun_compat || inputs.paced_tun) && '36082689922' || '36074709548' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reused
          merge-multiple: true
      - name: Verify exact existing binaries and prepare profiler
        env:
          TUN_COMPAT: ${{ inputs.tun_compat || inputs.paced_tun }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p profile-evidence
          mkdir -p reused/tools
          cp tools/easytier-perf-probe.rs reused/tools/
          cd reused
          expected=1639ec4534eb824ce88e7300b5fa1453839c4f25
          if [[ "$TUN_COMPAT" == true ]]; then
            expected=837349f8f5031d5c877b90edb6f195b6f9615af9
          fi
          test "$(cat flush-evidence/experiment-sha.txt)" = "$expected"
          sha256sum -c flush-evidence/binaries.sha256
          sha256sum -c flush-evidence/probe.sha256
          chmod +x flush-binaries/{stock,candidate}/easytier-{core,cli} flush-binaries/perf-probe
          cd ..
          cp reused/flush-evidence/{binaries.sha256,experiment-sha.txt,diagnostic-source.json} profile-evidence/
          printf '%s\n' "$GITHUB_SHA" > profile-evidence/harness-sha.txt
          sudo apt-get update -qq
          sudo apt-get install -y iproute2 iputils-ping ethtool tcpdump linux-tools-common "linux-tools-$(uname -r)"
          perf --version > profile-evidence/perf-version.txt
          uname -a > profile-evidence/kernel.txt
          lscpu > profile-evidence/cpu.txt
          python3 -m py_compile tools/mesh-udp-flush/lab.py
      - name: Profile both exact Core modes without repeating saturation comparisons
        env:
          TUN_TRACE: ${{ inputs.tun_trace }}
          TUN_COMPAT: ${{ inputs.tun_compat }}
          EXTENDED_TUN: ${{ inputs.extended_tun }}
          LOSS_REPLAY: ${{ inputs.loss_replay }}
          PACED_TUN: ${{ inputs.paced_tun }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PACED_TUN" == true ]]; then
            failed=0
            for rate in 200 600; do
              index=0
              for capacity in 0 8192 8192 0 0 8192; do
                order=legacy,gso
                if (( index % 2 )); then order=gso,legacy; fi
                if sudo timeout --signal=TERM --kill-after=15s 150s python3 tools/mesh-udp-flush/lab.py \
                  --stock reused/flush-binaries/stock --candidate reused/flush-binaries/candidate \
                  --output "profile-evidence/paced-${rate}-${index}-${capacity}" \
                  --order "$order" --tun-head-capacity "$capacity" --paced-mbps "$rate" \
                  --inner-ipv6 --mixed-flow --network-counters; then
                  printf 'paced rate %s capacity %s: PASS\n' "$rate" "$capacity"
                else
                  code=$?
                  printf 'paced rate %s capacity %s: FAIL exit %s\n' "$rate" "$capacity" "$code"
                  failed=1
                fi
                index=$((index + 1))
              done
            done
            exit "$failed"
          fi
          if [[ "$TUN_COMPAT" == true ]]; then
            if [[ "$LOSS_REPLAY" == true ]]; then
              failed=0
              index=0
              for capacity in 0 8192 8192 0 0 8192; do
                if sudo timeout --signal=TERM --kill-after=15s 180s python3 tools/mesh-udp-flush/lab.py \
                  --stock reused/flush-binaries/stock --candidate reused/flush-binaries/candidate \
                  --unpaced-probe reused/flush-binaries/perf-probe \
                  --output "profile-evidence/replay-${index}-${capacity}" \
                  --order legacy,gso --tun-head-capacity "$capacity" \
                  --transfer-bytes 268435456 --inner-ipv6 --mixed-flow --network-counters --icmp-capture; then
                  printf 'replay %s capacity %s: PASS\n' "$index" "$capacity"
                else
                  code=$?
                  printf 'replay %s capacity %s: FAIL exit %s\n' "$index" "$capacity" "$code"
                  failed=1
                fi
                index=$((index + 1))
              done
              exit "$failed"
            fi
            families=(ipv4)
            if [[ "$EXTENDED_TUN" == true ]]; then families+=(ipv6); fi
            for capacity in 0 8192; do
              for stealth in false true; do
                secure=()
                if [[ "$stealth" == true ]]; then secure=(--stealth); fi
                for family in "${families[@]}"; do
                  extra=()
                  if [[ "$EXTENDED_TUN" == true ]]; then extra+=(--mixed-flow); fi
                  if [[ "$family" == ipv6 ]]; then extra+=(--inner-ipv6); fi
                  sudo timeout --signal=TERM --kill-after=15s 180s python3 tools/mesh-udp-flush/lab.py \
                    --stock reused/flush-binaries/stock --candidate reused/flush-binaries/candidate \
                    --unpaced-probe reused/flush-binaries/perf-probe \
                    --output "profile-evidence/compat-${capacity}-${stealth}-${family}" \
                    --order legacy,gso --tun-head-capacity "$capacity" \
                    --transfer-bytes 268435456 "${secure[@]}" "${extra[@]}"
                done
              done
            done
            exit 0
          fi
          observation=(--profile)
          if [[ "$TUN_TRACE" == true ]]; then
            observation=(--tun-trace --transfer-bytes 67108864)
          fi
          sudo timeout --signal=TERM --kill-after=15s 600s python3 tools/mesh-udp-flush/lab.py \
            --stock reused/flush-binaries/stock --candidate reused/flush-binaries/candidate \
            --unpaced-probe reused/flush-binaries/perf-probe --output profile-evidence/lab \
            --order legacy,gso "${observation[@]}"
      - name: Preserve profile evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p profile-evidence
          sudo chown -R "$(id -u):$(id -g)" profile-evidence
          find profile-evidence -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > profile-evidence/SHA256SUMS
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: issue4-profile-${{ github.sha }}
          path: profile-evidence/
          retention-days: 30
          if-no-files-found: error

  integrated-packet-trace:
    if: ${{ inputs.packet_trace_current || inputs.packet_trace_reuse }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      SOURCE_SHA: 3166ab672d347cdcc5a6768bc77056cd8ec38323
      TARGET: x86_64-unknown-linux-musl
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '2'
      CARGO_PROFILE_RELEASE_STRIP: none
      RUSTFLAGS: -C force-frame-pointers=yes -C link-arg=-Wl,--build-id=sha1
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        if: ${{ inputs.packet_trace_reuse }}
        with:
          python-version: '3.12'
      - name: Prepare the same maintained musl build prerequisites
        if: ${{ !inputs.packet_trace_reuse }}
        uses: ./.github/actions/prepare-build
        with:
          target: x86_64-unknown-linux-musl
          pnpm: 'false'
          gui: 'false'
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare pinned source and observation-only overlay
        if: ${{ !inputs.packet_trace_reuse }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packet-evidence packet-binaries
          sudo apt-get update -qq
          sudo apt-get install -y -qq iproute2 iputils-ping ethtool tcpdump binutils
          rustup component add --toolchain 1.95 rustfmt
          timeout 90 git fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          git worktree add --detach "$RUNNER_TEMP/packet-trace-source" "$SOURCE_SHA"
          python3 -m py_compile tools/mesh-udp-flush/lab.py tools/mesh-udp-flush/packet_trace_prepare.py
          python3 tools/mesh-udp-flush/packet_trace_prepare.py "$RUNNER_TEMP/packet-trace-source" "$SOURCE_SHA" > packet-evidence/overlay.json
          rustfmt +1.95 --edition 2024 "$RUNNER_TEMP/packet-trace-source/easytier/src/peers/peer_manager.rs" "$RUNNER_TEMP/packet-trace-source/easytier/src/tunnel/udp.rs"
          git -C "$RUNNER_TEMP/packet-trace-source" diff --check
          git -C "$RUNNER_TEMP/packet-trace-source" diff --exit-code -- Cargo.lock
          git -C "$RUNNER_TEMP/packet-trace-source" diff --binary > packet-evidence/observation-only.patch
          cp "$RUNNER_TEMP/packet-trace-source/Cargo.lock" packet-evidence/Cargo.lock
          printf '%s\n' "$SOURCE_SHA" > packet-evidence/core-source-sha.txt
          printf '%s\n' "$GITHUB_SHA" > packet-evidence/harness-sha.txt
          printf '%s\n' 'Diagnostic overlay only; queue, budget, packet bytes and production source unchanged. Instrumented rates are not performance acceptance.' > packet-evidence/BOUNDARY.txt
          uname -a > packet-evidence/kernel.txt
          lscpu > packet-evidence/cpu.txt
          rustc +1.95 -Vv > packet-evidence/toolchain.txt
      - uses: Swatinem/rust-cache@v2
        if: ${{ !inputs.packet_trace_reuse }}
        with:
          prefix-key: profiling-comparator
          shared-key: linux-x86_64-musl
          workspaces: ${{ runner.temp }}/packet-trace-source -> target
          cache-targets: true
          cache-on-failure: true
      - name: Build only the diagnostic Core and matching CLI
        if: ${{ !inputs.packet_trace_reuse }}
        shell: bash
        run: |
          set -euo pipefail
          root="$PWD"
          cd "$RUNNER_TEMP/packet-trace-source"
          timeout 1800 cargo +1.95 build --locked --release --target "$TARGET" -j "$(nproc)" -p easytier --bin easytier-core --bin easytier-cli --features jemalloc 2>&1 | tee "$root/packet-evidence/build.log"
          git diff --exit-code -- Cargo.lock
          install -m 0755 "target/$TARGET/release/easytier-core" "target/$TARGET/release/easytier-cli" "$root/packet-binaries/"
          cd "$root"
          rustc +1.95 --edition 2024 -O tools/easytier-perf-probe.rs -o packet-binaries/probe
          sha256sum packet-binaries/* > packet-evidence/binaries.sha256
          file packet-binaries/* > packet-evidence/binary-format.txt
          readelf -n packet-binaries/easytier-core > packet-evidence/build-id.txt
      - name: Reuse and verify immutable diagnostic binaries without compiling
        if: ${{ inputs.packet_trace_reuse }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packet-evidence packet-binaries
          sudo apt-get update -qq
          sudo apt-get install -y -qq iproute2 iputils-ping ethtool tcpdump binutils
          python3 - <<'PY'
          import hashlib, json, os, shutil, sys, zipfile
          from pathlib import Path
          sys.path.insert(0, 'tools/mesh-udp-flush')
          from exact_artifact_lab import download
          root = Path('packet-evidence')
          original_harness = 'cfd1dc2ec1157c6d1449eed845b97eedf9a30c69'
          binary_sha = 'b6c7fd95e007339644d16a104bc9a70a1e5f449f86937cddaa0c02d3f46be165'
          evidence_sha = 'ee5f413bc2435a2d9f40c8a76212eaee418ab0a20526f25bb67c93b323172b6e'
          expected = {
              'easytier-core': 'b165f67da30203ae2eea86c05e5f4b157552d5168c23710ae39c75d518006680',
              'easytier-cli': 'b462eb22b7a9d54b0eab6c69892c4af6c5f499d78a7ce492087963f2a92b27e0',
              'probe': '62596a8dd4f53e538c0696e3f746d6010e03758f62fe00822510bc8d15c61ab0',
          }
          archive = root / 'reused-binaries.zip'
          metadata = download(10912354766, archive, binary_sha)
          assert metadata['workflow_run']['id'] == 36263145990
          assert metadata['workflow_run']['head_sha'] == original_harness
          with zipfile.ZipFile(archive) as zipped:
              assert set(zipped.namelist()) == set(expected)
              for name, sha in expected.items():
                  target = Path('packet-binaries') / name
                  with zipped.open(name) as source, target.open('xb') as destination:
                      shutil.copyfileobj(source, destination)
                  with target.open('rb') as stream:
                      assert hashlib.file_digest(stream, 'sha256').hexdigest() == sha
                  target.chmod(0o755)
          archive.unlink()
          archive = root / 'reused-evidence.zip'
          metadata = download(10912384647, archive, evidence_sha)
          assert metadata['workflow_run']['id'] == 36263145990
          assert metadata['workflow_run']['head_sha'] == original_harness
          with zipfile.ZipFile(archive) as zipped:
              assert zipped.read('core-source-sha.txt').decode().strip() == os.environ['SOURCE_SHA']
              assert zipped.read('harness-sha.txt').decode().strip() == original_harness
              build = root / 'reused-build'
              build.mkdir()
              for name in ('core-source-sha.txt', 'harness-sha.txt', 'overlay.json',
                           'observation-only.patch', 'binaries.sha256', 'build-id.txt', 'toolchain.txt'):
                  (build / name).write_bytes(zipped.read(name))
          archive.unlink()
          (root / 'reuse.json').write_text(json.dumps({
              'source': os.environ['SOURCE_SHA'], 'original_harness': original_harness,
              'harness': os.environ['GITHUB_SHA'], 'binary_artifact': 10912354766,
              'binary_archive_sha256': binary_sha, 'evidence_artifact': 10912384647,
              'evidence_archive_sha256': evidence_sha, 'binaries': expected,
              'core_rebuilt': False, 'performance_evidence': False,
          }, indent=2))
          PY
          python3 -m py_compile tools/mesh-udp-flush/lab.py
          uname -a > packet-evidence/kernel.txt
          lscpu > packet-evidence/cpu.txt
          sha256sum packet-binaries/* > packet-evidence/binaries.sha256
          readelf -n packet-binaries/easytier-core > packet-evidence/build-id.txt
          printf '%s\n' "$GITHUB_SHA" > packet-evidence/harness-sha.txt
          printf '%s\n' 'Reused diagnostic bytes; no Core build. Packet correlation only, not performance acceptance.' > packet-evidence/BOUNDARY.txt
      - name: Localize the first saturated IPv6 control-progress failure
        env:
          MIXED_FLOW: ${{ inputs.extended_tun }}
        shell: bash
        run: |
          set -euo pipefail
          extra=()
          if [[ "$MIXED_FLOW" == true ]]; then extra+=(--mixed-flow); fi
          for index in 0 1 2 3 4 5; do
            sudo timeout --signal=TERM --kill-after=10s 180s python3 tools/mesh-udp-flush/lab.py \
              --stock packet-binaries --candidate packet-binaries --order stock \
              --unpaced-probe packet-binaries/probe --transfer-bytes 1073741824 \
              --inner-ipv6 --network-counters --icmp-capture --packet-trace \
              --output "packet-evidence/case-$index" "${extra[@]}"
          done
      - name: Preserve bounded failure evidence and exact diagnostic binaries
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packet-evidence packet-binaries
          sudo chown -R "$(id -u):$(id -g)" packet-evidence packet-binaries
          find packet-evidence -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > packet-evidence/SHA256SUMS
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: integrated-packet-evidence-${{ github.sha }}
          path: packet-evidence/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        if: ${{ always() && !inputs.packet_trace_reuse }}
        with:
          name: integrated-packet-diagnostic-binaries-${{ github.sha }}
          path: packet-binaries/
          retention-days: 30
          if-no-files-found: warn
  gro-contract-and-core:
    if: ${{ inputs.udp_gro_current }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      SOURCE_SHA: 3166ab672d347cdcc5a6768bc77056cd8ec38323
      TARGET: x86_64-unknown-linux-musl
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '2'
      CARGO_PROFILE_RELEASE_STRIP: none
      RUSTFLAGS: -C force-frame-pointers=yes -C link-arg=-Wl,--build-id=sha1
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: ./.github/actions/prepare-build
        with:
          target: x86_64-unknown-linux-musl
          pnpm: 'false'
          gui: 'false'
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare the immutable source and receive-only experiment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gro-evidence gro-binaries
          sudo apt-get update -qq
          sudo apt-get install -y -qq iproute2 iputils-ping ethtool tcpdump binutils
          rustup component add --toolchain 1.95 rustfmt
          timeout 90 git fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          git worktree add --detach "$RUNNER_TEMP/gro-source" "$SOURCE_SHA"
          python3 -m py_compile tools/mesh-udp-flush/{lab,gro_prepare,gro_lab}.py
          python3 tools/mesh-udp-flush/gro_prepare.py "$RUNNER_TEMP/gro-source" > gro-evidence/overlay.json
          rustfmt +1.95 --edition 2024 --check "$RUNNER_TEMP/gro-source/easytier/src/tunnel/udp_gro_experiment.rs"
          rustfmt +1.95 --edition 2024 "$RUNNER_TEMP/gro-source/easytier/src/tunnel/udp.rs"
          git -C "$RUNNER_TEMP/gro-source" diff --check
          git -C "$RUNNER_TEMP/gro-source" diff --exit-code -- Cargo.lock
          git -C "$RUNNER_TEMP/gro-source" diff --binary > gro-evidence/receive-overlay.patch
          cp "$RUNNER_TEMP/gro-source/easytier/src/tunnel/udp_gro_experiment.rs" gro-evidence/
          cp "$RUNNER_TEMP/gro-source/Cargo.lock" gro-evidence/Cargo.lock
          printf '%s\n' "$SOURCE_SHA" > gro-evidence/core-source-sha.txt
          printf '%s\n' "$GITHUB_SHA" > gro-evidence/harness-sha.txt
          uname -a > gro-evidence/kernel.txt
          lscpu > gro-evidence/cpu.txt
          rustc +1.95 -Vv > gro-evidence/toolchain.txt
          printf '%s\n' 'Experimental receive adapter only; one binary off/on, 64 KiB per enabled reader. No queue/crypto/wire/TUN changes. Prior integrated saturation FAIL remains open.' > gro-evidence/BOUNDARY.txt
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: profiling-comparator
          shared-key: linux-x86_64-musl
          workspaces: ${{ runner.temp }}/gro-source -> target
          cache-targets: true
          cache-on-failure: true
      - name: Existing UDP contracts and real kernel adapter contracts
        env:
          ET_ISSUE4_UDP_GRO: 'on'
        shell: bash
        run: |
          set -euo pipefail
          root="$PWD"
          cd "$RUNNER_TEMP/gro-source"
          timeout 1800 cargo +1.95 test --locked --release --target "$TARGET" -j "$(nproc)" -p easytier --lib --features jemalloc tunnel::udp -- --test-threads=1 --nocapture 2>&1 | tee "$root/gro-evidence/udp-tests.log"
          timeout 120 cargo +1.95 test --locked --release --target "$TARGET" -j "$(nproc)" -p easytier --lib --features jemalloc hole_punch_listener_ -- --test-threads=1 --nocapture 2>&1 | tee "$root/gro-evidence/hole-punch-tests.log"
      - name: Build one experimental Core and matching CLI
        shell: bash
        run: |
          set -euo pipefail
          root="$PWD"
          cd "$RUNNER_TEMP/gro-source"
          timeout 1800 cargo +1.95 build --locked --release --target "$TARGET" -j "$(nproc)" -p easytier --bin easytier-core --bin easytier-cli --features jemalloc 2>&1 | tee "$root/gro-evidence/build.log"
          git diff --exit-code -- Cargo.lock
          install -m 0755 "target/$TARGET/release/easytier-core" "target/$TARGET/release/easytier-cli" "$root/gro-binaries/"
          cd "$root"
          rustc +1.95 --edition 2024 -O tools/easytier-perf-probe.rs -o gro-binaries/probe
          sha256sum gro-binaries/* > gro-evidence/binaries.sha256
          file gro-binaries/* > gro-evidence/binary-format.txt
          readelf -n gro-binaries/easytier-core > gro-evidence/build-id.txt
      - name: Interleaved actual Core CPU and functional comparisons
        shell: bash
        run: |
          set -euo pipefail
          for phase in fixed saturation mixed; do
            sudo timeout --signal=TERM --kill-after=15s 1200s python3 tools/mesh-udp-flush/gro_lab.py \
              --binaries gro-binaries --phase "$phase" --output "gro-evidence/$phase"
          done
      - name: Preserve the first failure and exact experimental identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gro-evidence gro-binaries
          sudo chown -R "$(id -u):$(id -g)" gro-evidence gro-binaries
          find gro-evidence -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > gro-evidence/SHA256SUMS
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: core-gro-evidence-${{ github.sha }}
          path: gro-evidence/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: core-gro-experimental-binaries-${{ github.sha }}
          path: gro-binaries/
          retention-days: 30
          if-no-files-found: warn
