name: EasyTier Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for this release'
        type: string
        default: 'v3.0.8'
        required: true
      make_latest:
        description: 'Mark this release as latest'
        type: boolean
        default: true
        required: true
      artifact_sha:
        description: 'Validated commit that produced the formal artifacts'
        type: string
        default: ''
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve immutable release source
        id: release-source
        env:
          REQUESTED_SHA: ${{ inputs.artifact_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          release_sha="${REQUESTED_SHA:-${WORKFLOW_SHA}}"
          if [[ ! "${release_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Invalid artifact SHA::Expected a full 40-character commit SHA"
            exit 1
          fi
          git cat-file -e "${release_sha}^{commit}"
          if [[ "${release_sha}" != "${WORKFLOW_SHA}" ]]; then
            git merge-base --is-ancestor "${release_sha}" "${WORKFLOW_SHA}" || {
              echo "::error title=Invalid artifact ancestry::${release_sha} is not an ancestor of ${WORKFLOW_SHA}"
              exit 1
            }
            mapfile -t changed_files < <(
              git diff --name-only "${release_sha}" "${WORKFLOW_SHA}"
            )
            if [[ "${#changed_files[@]}" -ne 1 || "${changed_files[0]}" != ".github/workflows/release.yml" ]]; then
              echo "::error title=Artifact source mismatch::Only release.yml may differ from the validated artifact commit"
              printf 'Changed file: %s\n' "${changed_files[@]}"
              exit 1
            fi
          fi
          echo "sha=${release_sha}" >> "$GITHUB_OUTPUT"

      - name: Validate release version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Invalid release version::Expected vMAJOR.MINOR.PATCH, got ${VERSION}"
            exit 1
          fi

          cargo_version=$(
            cargo metadata --format-version 1 --locked --no-deps \
              | jq -r '.packages[] | select(.name == "easytier") | .version'
          )
          if [[ "${VERSION}" != "v${cargo_version}" ]]; then
            echo "::error title=Version mismatch::Workflow input ${VERSION} does not match easytier Cargo version v${cargo_version}"
            exit 1
          fi

          if gh api "repos/${REPO}/git/ref/tags/${VERSION}" --silent 2>/dev/null; then
            echo "::error title=Tag already exists::Refusing to overwrite ${VERSION}"
            exit 1
          fi

      - name: Resolve workflow run IDs
        id: resolve-runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.release-source.outputs.sha }}
        run: |
          set -euo pipefail

          resolve_run_id() {
            local workflow_file="$1"
            local run_id
            local api_url="https://api.github.com/repos/${REPO}/actions/workflows/${workflow_file}/runs?head_sha=${SHA}&status=completed&per_page=20"

            run_id=$(
              curl -fsSL \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "${api_url}" \
                | jq -r '
                  [
                    .workflow_runs[]
                    | select(.conclusion == "success" and (.event == "push" or .event == "workflow_dispatch"))
                  ]
                  | sort_by(.run_number)
                  | last
                  | .id // empty
                '
            )

            if [[ -z "${run_id}" ]]; then
              echo "::error title=Missing successful workflow run::No successful ${workflow_file} run was found for commit ${SHA}. Push the target commit to develop/main/releases/**, wait for required workflows to finish successfully, then re-run this release workflow on the same ref." >&2
              echo "Expected workflow file: ${workflow_file}" >&2
              echo "Repository: ${REPO}" >&2
              echo "Commit: ${SHA}" >&2
              echo "Workflow page: https://github.com/${REPO}/actions/workflows/${workflow_file}" >&2
              exit 1
            fi

            echo "${run_id}"
          }

          {
            echo "core_run_id=$(resolve_run_id core.yml)"
            echo "gui_run_id=$(resolve_run_id gui.yml)"
            echo "mobile_run_id=$(resolve_run_id mobile.yml)"
            echo "test_run_id=$(resolve_run_id test.yml)"
            echo "ohos_run_id=$(resolve_run_id ohos.yml)"
          } >> "$GITHUB_OUTPUT"

      - name: Show resolved workflow run IDs
        run: |
          echo "core.yml   -> ${{ steps.resolve-runs.outputs.core_run_id }}"
          echo "gui.yml    -> ${{ steps.resolve-runs.outputs.gui_run_id }}"
          echo "mobile.yml -> ${{ steps.resolve-runs.outputs.mobile_run_id }}"
          echo "test.yml   -> ${{ steps.resolve-runs.outputs.test_run_id }}"
          echo "ohos.yml   -> ${{ steps.resolve-runs.outputs.ohos_run_id }}"

      - name: Download Core Artifact
        uses: dawidd6/action-download-artifact@v11
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          run_id: ${{ steps.resolve-runs.outputs.core_run_id }}
          repo: ${{ github.repository }}
          path: release_assets

      - name: Download GUI Artifact
        uses: dawidd6/action-download-artifact@v11
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          run_id: ${{ steps.resolve-runs.outputs.gui_run_id }}
          repo: ${{ github.repository }}
          path: release_assets_nozip

      - name: Download Mobile Artifact
        uses: dawidd6/action-download-artifact@v11
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          run_id: ${{ steps.resolve-runs.outputs.mobile_run_id }}
          repo: ${{ github.repository }}
          path: release_assets_nozip

      - name: Download OHOS Artifact
        uses: dawidd6/action-download-artifact@v11
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          run_id: ${{ steps.resolve-runs.outputs.ohos_run_id }}
          repo: ${{ github.repository }}
          path: release_assets_nozip

      - name: Select immutable candidate Mihomo release manifest
        run: |
          set -euo pipefail
          mapfile -d '' candidate_manifests < <(
            find release_assets -type f -name 'MIHOMO_RELEASE_MANIFEST.json' \
              -print0 | sort -z
          )
          test "${#candidate_manifests[@]}" -gt 0
          mkdir -p target
          cp "${candidate_manifests[0]}" target/mihomo-release-manifest.json

      - name: Verify policy release payloads
        env:
          MIHOMO_RELEASE_MANIFEST: ${{ github.workspace }}/target/mihomo-release-manifest.json
        run: |
          set -euo pipefail
          verify_core_manifest() {
            local artifact_dir="$1"
            local candidate_manifest="$artifact_dir/MIHOMO_RELEASE_MANIFEST.json"
            if [[ ! -f "$candidate_manifest" ]]; then
              echo "::error title=Missing Mihomo release manifest::$artifact_dir"
              exit 1
            fi
            cmp --silent "$MIHOMO_RELEASE_MANIFEST" "$candidate_manifest" || {
              echo "::error title=Mihomo version drift::$candidate_manifest differs from the immutable candidate manifest"
              exit 1
            }
          }
          gui_manifest_count=0
          gui_targets=(
            x86_64-unknown-linux-gnu
            aarch64-unknown-linux-gnu
            x86_64-apple-darwin
            aarch64-apple-darwin
            x86_64-pc-windows-msvc
            i686-pc-windows-msvc
            aarch64-pc-windows-msvc
          )
          for gui_target in "${gui_targets[@]}"; do
            mapfile -t gui_manifests < <(
              find release_assets_nozip -type f \
                -name "MIHOMO_RELEASE_MANIFEST-${gui_target}.json"
            )
            test "${#gui_manifests[@]}" -eq 1
            candidate_manifest="${gui_manifests[0]}"
            cmp --silent "$MIHOMO_RELEASE_MANIFEST" "$candidate_manifest" || {
              echo "::error title=Mihomo version drift::$candidate_manifest differs from the immutable candidate manifest"
              exit 1
            }
            gui_manifest_count=$((gui_manifest_count + 1))
          done
          test "$gui_manifest_count" -eq "${#gui_targets[@]}"
          declare -A mihomo_targets=(
            [easytier-linux-x86_64]=x86_64-unknown-linux-musl
            [easytier-linux-aarch64]=aarch64-unknown-linux-musl
            [easytier-linux-riscv64]=riscv64gc-unknown-linux-musl
            [easytier-freebsd-13.2-x86_64]=x86_64-unknown-freebsd
            [easytier-macos-x86_64]=x86_64-apple-darwin
            [easytier-macos-aarch64]=aarch64-apple-darwin
            [easytier-windows-x86_64]=x86_64-pc-windows-msvc
            [easytier-windows-i686]=i686-pc-windows-msvc
            [easytier-windows-arm64]=aarch64-pc-windows-msvc
          )
          for artifact in "${!mihomo_targets[@]}"; do
            artifact_dir=$(find release_assets -type d -name "$artifact" -print -quit)
            test -n "$artifact_dir"
            verify_core_manifest "$artifact_dir"
            suffix=""
            if [[ "$artifact" == easytier-windows-* ]]; then suffix=".exe"; fi
            test -f "$artifact_dir/easytier-core$suffix"
            test -f "$artifact_dir/easytier-mihomo$suffix"
            test -f "$artifact_dir/easytier-mihomo.manifest.json"
            test -f "$artifact_dir/MIHOMO_LICENSE.txt"
            test -f "$artifact_dir/MIHOMO_SOURCE.md"
            test -f "$artifact_dir/MIHOMO_SHA256SUMS.txt"
            test -f "$artifact_dir/MIHOMO_BUILD_INFO.txt"
            bash scripts/fetch-mihomo-release.sh verify \
              "${mihomo_targets[$artifact]}" \
              "$artifact_dir/easytier-mihomo$suffix" \
              "$artifact_dir/easytier-mihomo.manifest.json"
          done
          for artifact in \
            easytier-linux-loongarch64 \
            easytier-linux-armv7hf \
            easytier-linux-armv7 \
            easytier-linux-armhf \
            easytier-linux-arm \
            easytier-linux-mips \
            easytier-linux-mipsel
          do
            artifact_dir=$(find release_assets -type d -name "$artifact" -print -quit)
            test -n "$artifact_dir"
            verify_core_manifest "$artifact_dir"
            test -f "$artifact_dir/MIHOMO_UNSUPPORTED.txt"
            if find "$artifact_dir" -maxdepth 1 -type f \
              -name 'easytier-mihomo*' -print -quit | grep -q .
            then
              echo "::error title=Unexpected Mihomo payload::$artifact must not contain Mihomo"
              exit 1
            fi
          done
          declare -A socks_targets=(
            [easytier-linux-x86_64]=x86_64-unknown-linux-musl
            [easytier-linux-aarch64]=aarch64-unknown-linux-musl
            [easytier-freebsd-13.2-x86_64]=x86_64-unknown-freebsd
            [easytier-macos-x86_64]=x86_64-apple-darwin
            [easytier-macos-aarch64]=aarch64-apple-darwin
            [easytier-windows-x86_64]=x86_64-pc-windows-msvc
            [easytier-windows-i686]=i686-pc-windows-msvc
            [easytier-windows-arm64]=aarch64-pc-windows-msvc
          )
          for artifact in "${!socks_targets[@]}"; do
            artifact_dir=$(find release_assets -type d -name "$artifact" -print -quit)
            target="${socks_targets[$artifact]}"
            suffix=""
            backend="hev-native"
            if [[ "$artifact" == easytier-windows-* ]]; then suffix=".exe"; fi
            gost="$artifact_dir/easytier-gost$suffix"
            gost_metadata="$artifact_dir/easytier-gost.manifest.json"
            test -f "$artifact_dir/GOST_LICENSE.txt"
            test -f "$artifact_dir/GOST_SOURCE.md"
            bash scripts/fetch-gost-release.sh verify \
              "$target" "$gost" "$gost_metadata"
            if [[ "$target" == *windows* ]]; then backend="leaf-portable"; fi
            if [[ "$target" != *freebsd* ]]; then
            sidecar="$artifact_dir/easytier-hev-socks-egress$suffix"
            test -f "$sidecar"
            build_info="$artifact_dir/SOCKS_EGRESS_BUILD_INFO.txt"
            test -f "$build_info"
              grep -Fx "target=$target" "$build_info"
              grep -Fx "backend=$backend" "$build_info"
              python3 - "$sidecar" "$target" <<'PY'
          import pathlib, struct, sys
          data = pathlib.Path(sys.argv[1]).read_bytes()
          target = sys.argv[2]
          if "windows" in target:
              offset = struct.unpack_from("<I", data, 0x3c)[0]
              if data[offset:offset + 4] != b"PE\0\0":
                  raise SystemExit("invalid release socks-egress PE header")
              machine = struct.unpack_from("<H", data, offset + 4)[0]
              wanted = {"x86_64": 0x8664, "i686": 0x014c, "aarch64": 0xaa64}[target.split("-", 1)[0]]
          elif "apple-darwin" in target:
              machine = struct.unpack_from("<I", data, 4)[0]
              wanted = 0x01000007 if target.startswith("x86_64") else 0x0100000c
          else:
              if data[:4] != b"\x7fELF":
                  raise SystemExit("invalid release socks-egress ELF header")
              endian = "<" if data[5] == 1 else ">"
              machine = struct.unpack_from(endian + "H", data, 18)[0]
              wanted = 62 if target.startswith("x86_64") else 183
          if machine != wanted:
              raise SystemExit(f"release socks-egress machine mismatch: expected {wanted}, got {machine}")
          PY
          fi
          if [[ "$target" == *apple-darwin || "$target" == *freebsd* ]]; then
            # download-artifact does not preserve Unix modes. The packaging
            # step below restores 0755 for every shipped executable.
            test -f "$artifact_dir/easytier-gost-guardian"
          fi
          done

      - name: Fetch and verify corresponding Mihomo source
        env:
          MIHOMO_RELEASE_MANIFEST: ${{ github.workspace }}/target/mihomo-release-manifest.json
        run: |
          set -euo pipefail
          bash scripts/fetch-mihomo-release.sh fetch-source \
            release_assets_nozip/mihomo-source

      - name: Zip release assets
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p zipped_assets

          while IFS= read -r -d '' file; do
            destination="zipped_assets/$(basename "${file}")"
            if [[ -e "${destination}" ]]; then
              echo "::error title=Duplicate release asset::${destination}"
              exit 1
            fi
            mv -- "${file}" "${destination}"
          done < <(find release_assets_nozip -type f -print0)
          ls -lR ./zipped_assets

          cd release_assets
          ls -lR ./
          find . -type d -exec chmod 0755 {} +
          find . -type f -exec chmod 0644 {} +
          find . -type f \( \
            -name easytier-core -o \
            -name easytier-cli -o \
            -name easytier-web -o \
            -name easytier-leaf-worker -o \
            -name easytier-hev-socks-egress -o \
            -name easytier-gost-guardian -o \
            -name easytier-gost -o \
            -name easytier-mihomo -o \
            -name '*.sh' \
          \) -exec chmod 0755 {} +
          for path in ./*; do
            x=$(basename "${path}")
            if [[ "${x}" == "Easytier-Magisk" ]]; then
              # for Easytier-Magisk, make sure files are in the root of the zip
              pushd "${path}"
              zip -r "../../zipped_assets/${x}-${VERSION}.zip" .
              popd
            else
              zip -r "../zipped_assets/${x}-${VERSION}.zip" "${path}"
            fi
          done

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ inputs.version }}
          draft: false
          prerelease: false
          make_latest: ${{ inputs.make_latest }}
          target_commitish: ${{ steps.release-source.outputs.sha }}
          body_path: ./easytier/docs/release_notes/${{ inputs.version }}.md
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            ./zipped_assets/*
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ inputs.version }}
